[project]
name = "signalx"
version = "0.1.0"
description = "Automated Trading Signal Generation Library for Quantitative Analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "pandas_ta>=0.3.14b0",
    "ta>=0.11.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.0",
]

[project.scripts]
signalx = "signalx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalx"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
